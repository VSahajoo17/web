<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>R.R Sarees - Store Locator</title>
    <style>
        /* Page Body Styling */
        body {
            font-family: Arial, sans-serif; /* Sets clean text font */
            margin-top: 40px;     /* Space above the content */
            margin-bottom: 40px;  /* Space below the content */
            margin-left: 40px;    /* Space to the left of the content */
            margin-right: 40px;   /* Space to the right of the content */
            color: #333;          /* Dark gray text color */
        }

        /* Main Heading Styling */
        h1 {
            border-bottom-width: 2px;  /* Thickness of line under title */
            border-bottom-style: solid;/* Solid line style */
            border-bottom-color: #ddd;  /* Light gray line color */
            padding-bottom: 10px;      /* Space between title text and line */
        }

        /* Unordered List Container */
        .store-list {
            padding-top: 0px;    /* Removes top default browser padding */
            padding-bottom: 0px; /* Removes bottom default browser padding */
            padding-left: 0px;   /* Removes left indent so list aligns with title */
            padding-right: 0px;  /* Removes right default browser padding */
        }

        /* Individual List Items */
        .store-list li {
            margin-top: 15px;    /* Vertical space above each location */
            margin-bottom: 15px; /* Vertical space below each location */
            margin-left: 0px;    /* No extra horizontal space on left */
            margin-right: 0px;   /* No extra horizontal space on right */
            font-size: 18px;     /* Text size for list items */
        }

        /* Links inside list items */
        .store-list a {
            color: #0066cc;        /* Blue color for clickable links */
            text-decoration: none; /* Removes underline from links */
        }
    </style>
</head>
<body>

    <!-- Main Title -->
    <h1>R.R Sarees Store Locator</h1>
    
    <!-- Instruction Text -->
    <p>Click on any location below to view it on Google Maps:</p>

    <!-- List of Store Locations -->
    <ul class="store-list">
        <!-- Palma Store Link -->
        <li><a href="https://maps.google.com/?q=-20.274221,57.468132" target="_blank">Palma</a></li>
        
        <!-- Rose Hill Store Link -->
        <li><a href="https://maps.google.com/?q=-20.242224,57.471416" target="_blank">Rose Hill</a></li>
        
        <!-- Beau Bassin Store Link -->
        <li><a href="https://maps.google.com/?q=-20.215302,57.469524" target="_blank">Beau Bassin</a></li>
        
        <!-- Berthaud Store Link -->
        <li><a href="https://maps.google.com/?q=-20.268894,57.470066" target="_blank">Berthaud</a></li>
    </ul>

</body>
</html>
