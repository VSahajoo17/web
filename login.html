<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RR Saree - Login & Register</title>
    <style>
        :root {
            --primary-color: #800020; /* Deep Burgundy / Crimson */
            --secondary-color: #d4af37; /* Metallic Gold */
            --text-dark: #2c2c2c;
            --bg-light: #fdfbf7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            background-image: radial-gradient(rgba(212, 175, 55, 0.1) 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-top: 5px solid var(--primary-color);
            position: relative;
        }

        /* Home Button Styling */
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-home:hover {
            color: var(--primary-color);
        }

        .brand {
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
        }

        .brand p {
            color: #666;
            font-size: 0.9rem;
            font-style: italic;
            position: relative;
            display: inline-block;
        }

        .brand p::after {
            content: '';
            display: block;
            width: 50%;
            height: 1px;
            background: var(--secondary-color);
            margin: 8px auto 0 auto;
        }

        /* Toggle Tabs */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eaeaea;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            margin-bottom: -2px;
        }

        /* Form styling */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.1);
        }

        .forgot-pass {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
        }

        .forgot-pass a {
            color: var(--primary-color);
            font-size: 0.85rem;
            text-decoration: none;
        }

        .forgot-pass a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(128, 0, 32, 0.15);
        }

        .btn-submit:hover {
            background-color: #600018;
        }

        /* Footer links */
        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Back to Home Link -->
        <a href="index.html" class="back-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
        </a>

        <div class="brand">
            <h1>RR SAREE</h1>
            <p>Elegance in Every Weave</p>
        </div>

        <p id="form-message" role="status" aria-live="polite"></p>

        <div class="tabs">
            <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div id="login-panel" class="form-panel active">
            <form action="auth.php" method="POST">
                <input type="hidden" name="action" value="login">
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="name@example.com">
                </div>
                
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                </div>

                <div class="forgot-pass">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
            <div class="form-footer">
                Don't have an account? <a href="#" onclick="switchTab('register')">Register here</a>
            </div>
        </div>

        <!-- Registration Form -->
        <div id="register-panel" class="form-panel">
            <form action="auth.php" method="POST">
                <input type="hidden" name="action" value="register">
                <div class="input-group">
                    <label for="reg-firstname">First Name</label>
                    <input type="text" id="reg-firstname" name="firstname" required autocomplete="given-name" placeholder="Your first name">
                </div>

                <div class="input-group">
                    <label for="reg-lastname">Last Name</label>
                    <input type="text" id="reg-lastname" name="lastname" required autocomplete="family-name" placeholder="Your last name">
                </div>

                <div class="input-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" name="email" required autocomplete="email" placeholder="name@example.com">
                </div>

                <div class="input-group">
                    <label for="reg-phone">Mobile Number</label>
                    <input type="tel" id="reg-phone" name="phone_num" required autocomplete="tel" placeholder="Your mobile number">
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>
            <div class="form-footer">
                Already have an account? <a href="#" onclick="switchTab('login')">Login here</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            const panels = document.querySelectorAll('.form-panel');
            const buttons = document.querySelectorAll('.tab-btn');
            
            panels.forEach(panel => panel.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'login') {
                document.getElementById('login-panel').classList.add('active');
                document.getElementById('tab-login').classList.add('active');
            } else if (tabName === 'register') {
                document.getElementById('register-panel').classList.add('active');
                document.getElementById('tab-register').classList.add('active');
            }
        }

        const statusMessages = {
            registered: 'Account created. You can now sign in.',
            invalid_input: 'Check the details you entered and try again.',
            email_exists: 'That email address is already registered.',
            login_failed: 'Invalid email or password.',
            server_error: 'Something went wrong. Please try again.'
        };
        const params = new URLSearchParams(window.location.search);
        const message = statusMessages[params.get('status')];
        if (message) {
            document.getElementById('form-message').textContent = message;
        }
        if (params.get('form') === 'register') {
            switchTab('register');
        }
    </script>
</body>
</html>
